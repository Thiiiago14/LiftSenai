<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - LiftSenai</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg,#071025 0%,#081426 60%);
      color: #e6eef6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 12px;
      width: 600px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      color: #e6eef6;
    }
    th, td {
      border: 1px solid #06b6d4;
      padding: 10px;
    }
    th {
      background-color: #0b1220;
    }
    button {
      margin-top: 20px;
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      background: #ef4444;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    h2 {
      margin-top: 30px;
    }
  </style>
</head>
