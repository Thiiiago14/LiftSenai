<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro - LiftSenai</title>
  <style>
    
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg,#071025 0%,#081426 60%);
      color: #e6eef6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255,255,255,0.05);
      padding: 30px;
      border-radius: 12px;
      width: 360px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }
    button {
      background: #06b6d4;
      color: #022;
      font-weight: bold;
      cursor: pointer;
    }
    .msg {
      margin-top: 12px;
      font-size: 13px;
      color: #fca5a5;
      min-height: 18px;
    }
    a {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #06b6d4;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cadastro LiftSenai</h1>
    <form id="formCadastro" autocomplete="off">
      <input type="text" id="username" placeholder="Usuário" required />
      <input type="password" id="password" placeholder="Senha" required />
      <input type="password" id="passwordConfirm" placeholder="Confirme a senha" required />
      <button type="submit">Cadastrar</button>
    </form>
    <div id="msg" class="msg"></div>
    <a href="login.html">Já tem conta? Faça login</a>
  </div>

  <script>
    const form = document.getElementById('formCadastro');
    const msg = document.getElementById('msg');

    function getUsers() {
      const users = localStorage.getItem('users');
      return users ? JSON.parse(users) : [];
    }

    function saveUsers(users) {
      localStorage.setItem('users', JSON.stringify(users));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      msg.textContent = '';

      const username = form.username.value.trim();
      const password = form.password.value;
      const passwordConfirm = form.passwordConfirm.value;

      if (password !== passwordConfirm) {
        msg.textContent = 'As senhas não conferem.';
        return;
      }

      if (username.length < 3 || password.length < 4) {
        msg.textContent = 'Usuário precisa ter ao menos 3 caracteres e senha ao menos 4.';
        return;
      }

      const users = getUsers();
      const userExists = users.some(u => u.username.toLowerCase() === username.toLowerCase());
      if (userExists) {
        msg.textContent = 'Usuário já existe.';
        return;
      }

      users.push({ username, password });
      saveUsers(users);

      msg.style.color = '#86efac'; 
      msg.textContent = 'Cadastro realizado com sucesso! Você será redirecionado para login...';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    });
  </script>
</body>
</html>
